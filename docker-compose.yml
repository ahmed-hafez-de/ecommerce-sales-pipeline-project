services:
  # ===========================================================================
  # CORE ARCHITECTURE LAYER 1: DATA WAREHOUSE INFRASTRUCTURE
  # ===========================================================================
  warehouse-db:
    image: postgres:15-alpine
    container_name: ecommerce_warehouse_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "54876:5432"
    volumes:
      - warehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    entrypoint: [ "bash", "-c", "exec docker-entrypoint.sh postgres & until pg_isready -U postgres; do sleep 1; done; psql -U postgres -c 'CREATE DATABASE ecommerce_platform;' || true; psql -U postgres -c 'CREATE DATABASE ecommerce_platform_test;' || true; wait" ]

  # ===========================================================================
  # CORE ARCHITECTURE LAYER 2: AIRFLOW ENGINE ORCHESTRATION BACKEND
  # ===========================================================================
  airflow-db:
    image: postgres:15-alpine
    container_name: airflow_metadata_db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # LAYER 3: AIRFLOW APPLICATION SUITE OPERATORS
  # ===========================================================================
  airflow-init:
    image: apache/airflow:2.7.1-python3.10
    depends_on:
      airflow-db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    volumes:
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c "airflow db init &&
      airflow users create --username admin --firstname Admin --lastname Admin --role Admin --email admin@example.com --password admin"

  webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow_webserver
    depends_on:
      airflow-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg2-binary python-dotenv
      - PGHOST=warehouse-db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=ecommerce_platform
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    command: webserver

  scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow_scheduler
    depends_on:
      airflow-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - _PIP_ADDITIONAL_REQUIREMENTS=psycopg2-binary python-dotenv
      - PGHOST=warehouse-db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=ecommerce_platform
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - airflow_logs:/opt/airflow/logs
    command: scheduler

volumes:
  warehouse_postgres_data:
  airflow_postgres_data:
  airflow_logs:
